# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'
run: once

tasks:
  bundle:
    desc: Install tools from brewfile
    cmd: brew bundle install --file config/brewfile
  bundle-diff:
    desc: Compare bundle file to current installs
    cmd: tasks/diff-brewfile.sh
  fish:
    desc: Set fish as default shell
    cmds:
      - echo /opt/homebrew/bin/fish | sudo tee -a /etc/shells
      - chsh -s /opt/homebrew/bin/fish
  prefs:
    desc: Load prefs from dwrites, duti conf, and print manual prefs
    cmds:
      - config/dwrites.sh
      - killall Dock
      - duti config/duti.conf
      - bat cache --build
      - cat config/preferences.txt
  link:
    desc: Creates symlinks from home directory to repository files
    cmd: ruby tasks/link.rb
  gitinit:
    desc: Set git username/email, create ssh key, updates repository origin
    cmd: tasks/git-init.sh
